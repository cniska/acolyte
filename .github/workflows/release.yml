name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        if: matrix.target == 'linux-x64'
        run: bun run verify

      - name: Build binary
        run: bash scripts/build-compiled.sh

      - name: Smoke test binary
        run: ACOLYTE_SMOKE_EXTENDED=1 bash scripts/smoke-compiled.sh

      - name: Package artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/acolyte-${{ matrix.target }}.tar.gz acolyte
          cd artifacts && sha256sum acolyte-${{ matrix.target }}.tar.gz > acolyte-${{ matrix.target }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acolyte-${{ matrix.target }}
          path: artifacts/

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare source archives
        run: |
          git archive --format=tar.gz --output=artifacts/acolyte-source-${GITHUB_REF_NAME}.tar.gz HEAD
          git archive --format=zip --output=artifacts/acolyte-source-${GITHUB_REF_NAME}.zip HEAD

      - name: Add launcher
        run: |
          cp scripts/launcher.sh artifacts/launcher.sh
          cd artifacts && sha256sum launcher.sh > launcher.sha256

      - name: Generate checksums
        run: cd artifacts && sha256sum *.tar.gz *.zip launcher.sh > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  sync-site:
    name: Sync Website
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch site sync
        env:
          GH_TOKEN: ${{ secrets.ACOLYTE_SITE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/cniska/acolyte.sh/dispatches \
            -f event_type=acolyte-release \
            -f client_payload[ref]="$GITHUB_REF_NAME"

  publish-npm:
    name: Publish npm Packages
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        uses: jdx/mise-action@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build packages
        run: bun run scripts/build-npm.ts artifacts dist/npm

      # The platform packages go first: @acolyte/cli pins them as optional dependencies.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in darwin-arm64 linux-x64 cli; do
            npm publish "dist/npm/$package" --access public --provenance
          done

  bump-homebrew:
    name: Bump Homebrew Formula
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch formula bump
        env:
          GH_TOKEN: ${{ secrets.ACOLYTE_TAP_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/cniska/homebrew-tap/dispatches \
            -f event_type=acolyte-release \
            -f client_payload[ref]="$GITHUB_REF_NAME"
